services:
  - type: web
    name: jasmine-dental-coursework
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt && python scripts/cloud_prepare.py
    startCommand: gunicorn --chdir app config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_cloud
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DJANGO_TRUST_PROXY
        value: '1'
      - key: DJANGO_HTTPS
        value: '1'
      - key: INITIALIZE_DEMO
        value: '1'
      - key: DEMO_INITIAL_PASSWORD
        sync: false
