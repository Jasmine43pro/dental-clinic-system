services:
  - type: web
    name: jasmine-dental-coursework
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/cloud_prepare.py
    startCommand: python scripts/cloud_start.py
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_cloud
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jasmine-dental-db
          property: connectionString
      - key: DJANGO_TRUST_PROXY
        value: '1'
      - key: DJANGO_HTTPS
        value: '1'
      - key: INITIALIZE_DEMO
        value: '1'
      - key: DEMO_INITIAL_PASSWORD
        sync: false

databases:
  - name: jasmine-dental-db
    plan: free
    ipAllowList: []
